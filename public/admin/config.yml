backend:
  name: github
  repo: jjalcaraz/getfridgeai
  branch: main
  base_url: https://www.getfridgeai.com
  auth_endpoint: /api/auth/decap/auth
  api_root: https://api.github.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: string }
      - { name: body, label: Body, widget: markdown }
